<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | AUREX Full-Stack Internship</title>

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232563eb'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='60' fill='%23ffffff'>T</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="styles/main.css">
</head>

<body>

    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <i class="fa-solid fa-list-check brand-icon"></i>
                <h1>Task<span>Flow</span></h1>
            </div>
            <p class="author-tag">Faiz Ul Hassan &bull; Week 4</p>
        </div>
    </header>

    <main class="main-container">
        <section class="task-form-card">
            <h2>Manage Your Tasks</h2>
            <form id="task-form" novalidate>
                <input type="hidden" id="task-edit-id" value="">

                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="text" id="task-title" placeholder="What needs to be accomplished today?"
                            autocomplete="off">
                        <span id="title-error" class="error-msg"></span>
                    </div>

                    <div class="priority-wrapper">
                        <select id="task-priority" aria-label="Task Priority">
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="low">Low</option>
                        </select>
                    </div>

                    <button type="submit" id="submit-btn" class="btn btn-primary">
                        <i class="fa-solid fa-plus btn-icon"></i>
                        <span id="submit-text">Add Task</span>
                    </button>
                </div>
            </form>
        </section>

        <section class="controls-panel">
            <div class="filter-group">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="pending">Pending</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div class="stats-badge">
                <span id="task-counter">0 tasks remaining</span>
            </div>
        </section>

        <section class="tasks-section">
            <ul id="task-list" class="task-list" aria-live="polite"></ul>

            <div id="empty-state" class="empty-state hidden">
                <i class="fa-regular fa-clipboard empty-icon"></i>
                <p>No tasks found in this view.</p>
            </div>
        </section>
    </main>

    <script src="scripts/main.js"></script>
</body>

</html>
